name: FOOTY Harness

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # Validate and build the same PR head; not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Harness regression tests
        run: python3 -m unittest discover -s scripts/harness/tests -v
      - name: Verify PR changes
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
        run: ./scripts/harness/check.sh --base "$PR_BASE" --head "$PR_HEAD" --branch "$PR_BRANCH"
      - name: Verify baseline build
        if: github.event_name != 'pull_request'
        run: ./scripts/harness/check.sh --mode baseline

  harness:
    name: harness
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every platform to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
