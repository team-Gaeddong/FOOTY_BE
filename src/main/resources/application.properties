spring.application.name=FOOTY_BE

# PostgreSQL (D-06). 접속 정보는 환경변수로만 받는다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 스키마 생성 방식은 미결정(D-06)이라 Hibernate가 스키마를 건드리지 않게 둔다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Google OAuth (D-05c, D-05d). 클라이언트 정보는 환경변수로만 받는다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Redis: refresh 토큰, 1회용 로그인 코드, access 블랙리스트 (D-05b)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT (D-05a). JWT_SECRET은 32바이트 이상
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=30m
jwt.refresh-token-expiration=14d

# Google 로그인 후 돌아갈 프론트 주소와 1회용 코드 유효 시간 (D-05d)
auth.redirect-uri=${OAUTH_REDIRECT_URI}
auth.login-code-expiration=1m
