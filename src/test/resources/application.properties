spring.application.name=FOOTY_BE

# 테스트는 H2를 PostgreSQL 호환 모드로 쓴다(D-06).
spring.datasource.url=jdbc:h2:mem:footy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# 테스트용 더미 값. 실제 키·시크릿이 아니다.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.data.redis.host=localhost
spring.data.redis.port=6379
jwt.secret=test-jwt-secret-key-must-be-at-least-32-bytes
jwt.access-token-expiration=30m
jwt.refresh-token-expiration=14d
auth.redirect-uri=http://localhost:3000/login/callback
auth.login-code-expiration=1m
